[project]
name = "ticket-agent"
version = "0.4.0"
description = "Outlook 메일을 수집해 티켓으로 적재하고, 완료 티켓의 회신을 발송하는 로컬 에이전트"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "supabase>=2.10",
    "python-dotenv>=1.0",
    # Outlook COM. Windows 에서만 설치됩니다 — macOS/Linux 개발 시에는 fixture 백엔드를 씁니다.
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ticket-agent = "ticket_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
