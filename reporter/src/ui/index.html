<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>태스크 맵</title>
<style>
  /* 색은 보고서(layout.ts)와 같은 값을 씁니다 — 화면에서 고른 것이 그대로 나갑니다 */
  :root {
    --navy:#1F3A5F; --ink:#1A2233; --muted:#5B6B7B; --band:#DCE6F1;
    --panel:#F4F6F8; --rule:#E4E9EF; --teal:#0F766E; --red:#9B2C2C; --amber:#B7791F;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
         color:var(--ink); background:#fff; }
  header { padding:10px 16px; border-bottom:1px solid var(--rule); display:flex; gap:16px;
           align-items:center; flex-wrap:wrap; position:sticky; top:0; background:#fff; z-index:2; }
  h1 { font-size:15px; margin:0; color:var(--navy); }
  .meta { color:var(--muted); font-size:12px; }
  .spacer { flex:1; }
  button { font:inherit; padding:5px 10px; border:1px solid var(--rule); background:#fff;
           border-radius:5px; cursor:pointer; color:var(--ink); }
  button:hover:not(:disabled) { background:var(--panel); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--navy); color:#fff; border-color:var(--navy); }
  button.primary:hover:not(:disabled) { background:#16304f; }
  .badge { padding:3px 8px; border-radius:10px; font-size:12px; background:var(--panel); color:var(--muted); }
  .badge.warn { background:#FBEBD0; color:var(--amber); }
  .badge.bad { background:#F7DFDF; color:var(--red); }

  /* 1page 예산 — 이 화면의 핵심 지표입니다 */
  .gauge { display:flex; align-items:center; gap:8px; font-size:12px; }
  .track { width:150px; height:9px; background:var(--rule); border-radius:5px; overflow:hidden; }
  .fill { height:100%; background:var(--teal); }
  .fill.over { background:var(--red); }

  main { display:grid; grid-template-columns:1fr 380px; gap:0; align-items:start; }
  .list { padding:12px 16px; border-right:1px solid var(--rule); min-height:70vh; }
  .side { padding:12px 16px; position:sticky; top:53px; }

  .proj { margin-bottom:14px; }
  .proj > h2 { font-size:12.5px; margin:0 0 5px; color:var(--navy);
               background:var(--band); padding:4px 8px; border-radius:4px; }
  .proj.none > h2 { background:var(--panel); color:var(--muted); }
  .row { display:flex; align-items:center; gap:8px; padding:3px 8px; border-radius:4px; }
  .row:hover { background:var(--panel); }
  .row.sel { background:#EAF1F9; }
  .row .t { flex:1; }
  /* 폭은 .row 안으로 한정하지 않습니다 — 열 머리글(.colhead)도 같은 폭을 써야
     세로줄이 맞습니다. 한정했다가 머리글만 제자리를 벗어난 적이 있습니다 */
  .who { color:var(--muted); font-size:12px; width:74px; flex:none; }
  .pct { font-size:12px; width:44px; flex:none; text-align:right; color:var(--navy); font-weight:600; }
  .day { font-size:11.5px; width:82px; flex:none; text-align:center; color:var(--muted); }
  /* 예정일은 연하게, 실제 종료일은 진하게 — 한눈에 갈려야 합니다 */
  .day.actual { color:var(--ink); }
  .stbox { width:52px; flex:none; text-align:center; }
  .mini { font-size:11px; padding:1px 6px; border-radius:4px; border:1px solid var(--rule);
          background:#fff; color:var(--muted); cursor:pointer; flex:none; white-space:nowrap; }
  .mini:hover { background:var(--panel); color:var(--red); border-color:var(--red); }
  .colhead { display:flex; gap:8px; padding:2px 8px 3px; font-size:11px; color:var(--muted);
             border-bottom:1px solid var(--rule); margin-bottom:2px; }
  .colhead .t { flex:1; }
  .colhead .pct, .colhead .day { text-align:center; }
  .row .st { font-size:11px; padding:1px 6px; border-radius:8px; background:var(--panel); color:var(--muted); }
  .st.done { background:#D8EDEB; color:var(--teal); }
  .st.ing  { background:var(--band); color:var(--navy); }
  .st.hold { background:#FBEBD0; color:var(--amber); }
  .entry { border:1px solid var(--rule); border-radius:5px; padding:4px 6px; margin:4px 0; }
  .entry.hidden { opacity:.5; }
  .entry > .row .t { font-weight:600; }
  .members { margin:2px 0 2px 26px; color:var(--muted); font-size:12px; }
  .members li { list-style:none; padding:1px 0; }
  .members li::before { content:'└ '; color:var(--rule); }

  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  /* 체크박스까지 100% 로 늘리면 행이 통째로 밀립니다 — 목록이 오른쪽으로 쏠렸었습니다 */
  input:not([type=checkbox]), select, textarea {
    width:100%; font:inherit; padding:5px 7px; border:1px solid var(--rule);
    border-radius:4px; color:var(--ink); background:#fff; }
  input[type=checkbox] { width:auto; margin:0; flex:none; }
  textarea { resize:vertical; min-height:52px; }
  .hint { font-size:11.5px; color:var(--muted); margin-top:6px; }
  .sugg { border-top:1px solid var(--rule); padding:10px 16px; }
  .sugg .item { display:flex; gap:10px; align-items:flex-start; padding:6px 0; border-bottom:1px dashed var(--rule); }
  .sugg .item:last-child { border-bottom:0; }
  .sugg .why { flex:1; }
  .sugg .why b { color:var(--navy); }
  .sugg .why span { display:block; color:var(--muted); font-size:12px; }
  .err { background:#F7DFDF; color:var(--red); padding:8px 12px; margin:8px 16px; border-radius:5px; font-size:12.5px; }
  .empty { color:var(--muted); padding:20px 0; }
  .note { margin:0; padding:7px 16px; background:var(--panel); color:var(--muted);
          font-size:12px; border-bottom:1px solid var(--rule); }
  .note b { color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>태스크 맵</h1>
  <span class="meta" id="meta"></span>
  <span class="badge" id="bUnmapped"></span>
  <span class="badge" id="bBroken"></span>
  <span class="badge" id="bHidden"></span>
  <div class="spacer"></div>
  <div class="gauge">
    <span id="gaugeText" class="meta"></span>
    <div class="track"><div class="fill" id="gaugeFill"></div></div>
  </div>
  <button id="btnMerge" disabled>선택 묶기</button>
  <button id="btnExclude" disabled>선택 제외</button>
  <button id="btnSave" class="primary" disabled>저장</button>
</header>

<p class="note" id="legend">
  <b>항목 미지정</b> = 태스크 맵에 보고 항목을 아직 안 만든 태스크입니다.
  <b>프로젝트 소속과는 상관없습니다</b> — 프로젝트에 붙어 있어도 항목을 안 만들었으면 여기에 셉니다.
  보고서에는 <b>원본 그대로 한 줄씩</b> 나가므로 그냥 둬도 됩니다. 여러 건을 한 줄로 합치거나
  이름·프로젝트를 바꾸고 싶을 때만 항목을 만듭니다.
</p>

<div id="errors"></div>

<main>
  <div class="list" id="list"></div>
  <div class="side" id="side"></div>
</main>

<div class="sugg" id="sugg"></div>

<script>
/*
 * 화면 상태는 셋뿐입니다 — 서버에서 받은 data, 편집 중인 map, 선택.
 * map 은 저장 전까지 브라우저에만 있고, 저장하면 서버가 다시 계산해서 돌려줍니다.
 */
let data = null           // /api/state 응답
let map = { version:1, updatedAt:'', entries:[] }
let dirty = false
let selectedEntry = null  // entry.key
const picked = new Set()  // 체크한 원본 태스크 id

/* desk 의 상태 4종. 보류는 보고서 표에서 빠지고 이슈 절로 갑니다 */
const STATUS_KO = { done: '완료', ing: '진행중', todo: '대기', hold: '보류' }

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))

async function load() {
  const r = await fetch('/api/state')
  const j = await r.json()
  if (!r.ok) return showErrors(j.errors)
  data = j
  map = j.taskmap
  dirty = false
  render()
}

function showErrors(errors) {
  $('errors').innerHTML = (errors ?? []).map((e) => `<div class="err">${esc(e)}</div>`).join('')
}

/* ── 파생값 ───────────────────────────────────────────────────────────── */

const workById = () => new Map(data.works.map((w) => [w.id, w]))
const claimed = () => new Set(map.entries.flatMap((e) => e.members))

/** 항목이 속한 프로젝트 — 지정이 없으면 구성원에게서 물려받습니다 (서버 규칙과 같음) */
function entryProject(e) {
  if (e.project !== undefined) return e.project
  const ps = [...new Set(e.members.map((id) => workById().get(id)?.project ?? null))]
  return ps.length === 1 ? ps[0] : null
}

function entryTitle(e) {
  return e.title || workById().get(e.members[0])?.title || e.key
}

/* ── 그리기 ───────────────────────────────────────────────────────────── */

/**
 * 그리기만 합니다.
 *
 * `render()` 와 나눈 이유는 미리보기 응답이 온 뒤 **다시 그려야** 하기 때문입니다.
 * render() 를 그대로 부르면 미리보기 → 그리기 → 미리보기 … 로 무한히 돕니다.
 */
function draw() {
  const by = workById()
  $('meta').textContent = `스냅샷 ${data.snapshot.day} · 업무 ${data.snapshot.work}건 · ${data.budget.week}`

  badge('bUnmapped', `항목 미지정 ${data.works.length - claimed().size}건`, 'warn', true)
  badge('bBroken', `끊어진 참조 ${data.issues.broken.length}건`, 'bad', data.issues.broken.length > 0)
  badge('bHidden', `제외 ${data.issues.hidden}건`, '', data.issues.hidden > 0)

  const b = data.budget
  const pct = Math.min(100, (b.needed / b.budget) * 100)
  $('gaugeFill').style.width = pct + '%'
  $('gaugeFill').className = 'fill' + (b.fits ? '' : ' over')
  $('gaugeText').textContent = `1page ${b.needed.toFixed(2)} / ${b.budget.toFixed(2)}인치` + (b.fits ? '' : ' — 넘칩니다')

  $('btnSave').disabled = !dirty
  $('btnMerge').disabled = picked.size < 1
  $('btnExclude').disabled = picked.size < 1

  // 프로젝트별로: 그 프로젝트의 항목 + 아직 분류 안 된 원본 태스크
  const groups = data.projects.map((p) => ({ key: p.key, title: p.title }))
  groups.push({ key: null, title: '프로젝트 없음' })

  const cl = claimed()
  let html = ''
  for (const g of groups) {
    const entries = map.entries.filter((e) => entryProject(e) === g.key)
    const loose = data.works.filter((w) => !cl.has(w.id) && (w.project ?? null) === g.key)
    if (entries.length === 0 && loose.length === 0) continue

    html += `<div class="proj ${g.key ? '' : 'none'}"><h2>${esc(g.title)} · 보고 항목 ${entries.length} · 항목 미지정 ${loose.length}</h2>
      <div class="colhead"><span style="width:13px;flex:none"></span><span class="t">안건</span><span class="who">담당</span>
        <span class="pct">진척</span><span class="day">시작</span><span class="day">종료(예정)</span>
        <span class="stbox">상태</span><span style="width:40px;flex:none"></span></div>`
    for (const e of entries) html += entryHtml(e, by)
    for (const w of loose) html += looseHtml(w)
    html += '</div>'
  }
  $('list').innerHTML = html || '<div class="empty">표시할 업무가 없습니다.</div>'
  $('side').innerHTML = sideHtml()
  $('sugg').innerHTML = suggHtml()
  wire()
}

function render() {
  draw()
  // 서버가 계산한 기간·진척·예산을 저장 전에도 받아 옵니다
  if (dirty) previewBudget()
}

/*
 * 저장하지 않은 맵으로 예산을 다시 계산합니다.
 * 게이지는 '지금 고치는 중인 구성이 한 장에 들어가는가' 를 보는 것이라,
 * 저장해야 갱신되면 쓸모가 절반입니다.
 */
let previewTimer = null
function previewBudget() {
  clearTimeout(previewTimer)
  previewTimer = setTimeout(async () => {
    const r = await fetch('/api/preview', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(map),
    })
    if (!r.ok) return
    const j = await r.json()
    data.budget = j.budget
    data.issues = j.issues
    data.entryViews = j.entryViews
    // 항목의 기간·진척과 제외 뱃지가 이 응답에 실려 오므로 다시 그립니다
    draw()
  }, 150)
}

function badge(id, text, cls, show) {
  const el = $(id)
  el.textContent = text
  el.className = 'badge ' + (cls || '')
  el.style.display = show ? '' : 'none'
}

function entryHtml(e, by) {
  const members = e.members.map((id) => by.get(id))
  const missing = e.members.filter((id) => !by.get(id))
  const done = members.filter((m) => m && m.status === 'done').length
  // 기간·진척은 서버가 계산해 보내 준 값입니다 (data.entryViews)
  const v = (data.entryViews ?? {})[e.key]
  return `
  <div class="entry ${e.hidden ? 'hidden' : ''}">
    <div class="row entry-row ${selectedEntry === e.key ? 'sel' : ''}" data-entry="${esc(e.key)}">
      <span style="width:13px;flex:none"></span>
      <span class="t">${esc(entryTitle(e))}</span>
      <span class="who"></span>
      <span class="pct">${v ? v.progress + '%' : ''}</span>
      <span class="day">${v && v.start ? esc(v.start) : '—'}</span>
      <span class="day ${v && v.endIsActual ? 'actual' : ''}">${v && v.end ? (v.endIsActual ? '' : '~') + esc(v.end) : '(계획)'}</span>
      <span class="stbox">${e.members.length > 1 ? `<span class="st">구성 ${done}/${e.members.length}</span>` : ''}</span>
      ${missing.length ? `<span class="st" style="background:#F7DFDF;color:var(--red)">끊김 ${missing.length}</span>` : ''}
      ${e.hidden ? `<span class="st">제외</span><button class="mini" data-restore="${esc(e.key)}">되돌리기</button>` : ''}
    </div>
    ${
      // 구성원이 하나뿐이고 이름도 안 바꿨으면 멤버 줄이 제목과 같은 말입니다.
      // 제외만 하려고 만든 항목이 대부분 여기 해당합니다.
      e.members.length > 1 || e.title
        ? `<ul class="members">
      ${members.map((m, i) => `<li>${m ? esc(m.title) + (m.owner ? ` (${esc(m.owner)})` : '') : `<span style="color:var(--red)">없어진 태스크: ${esc(e.members[i])}</span>`}</li>`).join('')}
    </ul>`
        : ''
    }
  </div>`
}

function looseHtml(w) {
  // 종료일은 완료면 실제 완료일, 아직이면 마감일(예정)입니다. 둘 다 없으면 (계획)
  const end = w.completedOn || w.due
  const actual = Boolean(w.completedOn)
  return `
  <div class="row">
    <input type="checkbox" data-pick="${esc(w.id)}" ${picked.has(w.id) ? 'checked' : ''}>
    <span class="t">${esc(w.title)}</span>
    <span class="who">${esc(w.owner || '—')}</span>
    <span class="pct">${w.progress === null || w.progress === undefined ? '' : w.progress + '%'}</span>
    <span class="day">${w.start ? esc(w.start) : '—'}</span>
    <span class="day ${actual ? 'actual' : ''}">${end ? (actual ? '' : '~') + esc(end) : '(계획)'}</span>
    <span class="stbox"><span class="st ${w.status}">${STATUS_KO[w.status] ?? w.status}</span></span>
    <button class="mini" data-exclude="${esc(w.id)}">제외</button>
  </div>`
}

function sideHtml() {
  const e = map.entries.find((x) => x.key === selectedEntry)
  if (!e) {
    return `<p class="hint">왼쪽에서 <b>항목</b>을 누르면 여기서 이름·프로젝트·진행내용을 고칠 수 있습니다.<br><br>
      항목을 안 만든 태스크는 체크해서 <b>선택 묶기</b>로 항목을 만듭니다.
      한 건만 묶어도 됩니다 — 이름만 바꾸거나 프로젝트만 옮길 때 그렇게 합니다.</p>`
  }
  const by = workById()
  return `
    <label>표기명</label>
    <input id="fTitle" value="${esc(e.title ?? '')}" placeholder="${esc(entryTitle(e))}">
    <label>프로젝트</label>
    <select id="fProject">
      <option value="__inherit__" ${e.project === undefined ? 'selected' : ''}>구성원에게서 물려받기</option>
      <option value="" ${e.project === null ? 'selected' : ''}>없음 (독립 항목)</option>
      ${data.projects.map((p) => `<option value="${esc(p.key)}" ${e.project === p.key ? 'selected' : ''}>${esc(p.title)}</option>`).join('')}
    </select>
    <label>주요 진행 내용</label>
    <textarea id="fNote" placeholder="desk 에 기록이 없을 때만 채웁니다">${esc(e.note ?? '')}</textarea>
    <label><input type="checkbox" id="fHidden" ${e.hidden ? 'checked' : ''} style="width:auto"> 보고서에서 제외</label>
    <p class="hint">제외해도 <b>각주에 건수가 남습니다</b>. 한 일을 안 한 것처럼 만들지 않기 위해서입니다.</p>
    <label>구성 태스크 ${e.members.length}건</label>
    <ul class="members">
      ${e.members.map((id) => `<li>${esc(by.get(id)?.title ?? id)} <button data-drop="${esc(id)}" style="padding:0 5px">빼기</button></li>`).join('')}
    </ul>
    <div style="margin-top:10px; display:flex; gap:6px">
      <button id="btnSplit">항목 분리</button>
      <button id="btnDelete">항목 삭제</button>
    </div>
    <p class="hint">분리·삭제해도 원본 태스크는 desk 에 그대로 있습니다. 미분류로 돌아갑니다.</p>`
}

/*
 * 화면에 실제로 보이는 추천만 담습니다.
 *
 * 버튼의 data-sugg 는 **이 배열의 인덱스**입니다. 한때 전체 목록(data.suggestions)을
 * 인덱스로 되짚었는데, 하나를 적용하면 목록이 줄어들면서 번호가 밀려
 * **엉뚱한 추천이 다시 적용됐습니다** — 두 번째 추천을 눌렀는데 첫 번째가 한 번 더
 * 묶이는 식입니다. 보이는 것과 눌리는 것이 같으려면 같은 배열을 봐야 합니다.
 */
let liveSuggestions = []

function suggHtml() {
  const cl = claimed()
  liveSuggestions = (data.suggestions ?? []).filter((s) => s.memberIds.every((id) => !cl.has(id)))
  const live = liveSuggestions
  if (live.length === 0) return '<p class="hint">추천할 묶음이 없습니다.</p>'
  return `<b style="color:var(--navy)">추천 ${live.length}건</b>
    ${live.map((s, i) => `
      <div class="item">
        <div class="why">
          <b>${esc(s.title)}</b> · ${s.memberIds.length}건
          <span>${esc(s.reason)}</span>
          <span>${s.memberTitles.map(esc).join(' / ')}</span>
        </div>
        <button data-sugg="${i}">이대로 묶기</button>
      </div>`).join('')}
    <p class="hint">추천은 <b>제안일 뿐</b>입니다. 누르면 그때 규칙이 되고, 다음 주부터 자동 적용됩니다.</p>`
}

/* ── 조작 ─────────────────────────────────────────────────────────────── */

function newKey(title) {
  const base = 'e-' + (title || 'item').replace(/\s+/g, '-').slice(0, 24)
  let key = base, n = 2
  while (map.entries.some((e) => e.key === key)) key = `${base}-${n++}`
  return key
}

function createEntry(ids, opts = {}) {
  // 이미 다른 항목에 든 태스크는 받지 않습니다. 한 태스크가 두 항목에 걸치면
  // 건수가 두 번 세어지고, 저장 단계에서 거부당합니다.
  const cl = claimed()
  ids = ids.filter((id) => !cl.has(id))
  if (ids.length === 0) return

  const by = workById()
  const title = opts.title || by.get(ids[0])?.title || ''
  const e = { key: newKey(title), members: [...ids] }
  if (opts.title) e.title = opts.title
  if (opts.project !== undefined) e.project = opts.project
  if (opts.hidden) e.hidden = true
  map.entries.push(e)
  // 제외는 편집할 것이 없으므로 오른쪽 패널을 열지 않습니다
  selectedEntry = opts.hidden ? selectedEntry : e.key
  picked.clear()
  dirty = true
  render()
}

function wire() {
  document.querySelectorAll('[data-pick]').forEach((el) => {
    el.onchange = () => {
      const id = el.dataset.pick
      el.checked ? picked.add(id) : picked.delete(id)
      // 한 건만 골라도 됩니다 — 이름만 바꾸거나 프로젝트만 옮기는 경우입니다
      $('btnMerge').disabled = picked.size < 1
      $('btnExclude').disabled = picked.size < 1
      $('btnMerge').textContent = picked.size > 1 ? `선택 ${picked.size}건 묶기` : '선택 항목 만들기'
      $('btnExclude').textContent = picked.size > 1 ? `선택 ${picked.size}건 제외` : '선택 제외'
    }
  })
  document.querySelectorAll('[data-exclude]').forEach((el) => {
    el.onclick = (ev) => {
      ev.stopPropagation()
      // 제외도 '항목' 입니다 — 구성원 하나짜리 숨김 항목을 만듭니다.
      // 별도의 제외 목록을 두면 규칙이 두 갈래가 되고 서로 어긋납니다.
      createEntry([el.dataset.exclude], { hidden: true })
    }
  })
  document.querySelectorAll('[data-restore]').forEach((el) => {
    el.onclick = (ev) => {
      ev.stopPropagation()
      const e = map.entries.find((x) => x.key === el.dataset.restore)
      // 제외하려고만 만든 항목이면 통째로 지웁니다. 이름·프로젝트를 손댄
      // 항목이면 제외만 풀고 그 설정은 남깁니다.
      const bare = e.members.length === 1 && !e.title && e.project === undefined && !e.note
      if (bare) map.entries = map.entries.filter((x) => x.key !== e.key)
      else delete e.hidden
      if (selectedEntry === e.key && bare) selectedEntry = null
      dirty = true
      render()
    }
  })
  document.querySelectorAll('[data-entry]').forEach((el) => {
    el.onclick = () => { selectedEntry = el.dataset.entry; render() }
  })
  document.querySelectorAll('[data-sugg]').forEach((el) => {
    el.onclick = () => {
      const s = liveSuggestions[Number(el.dataset.sugg)]
      if (!s) return
      createEntry(s.memberIds, { title: s.title, project: s.project })
    }
  })
  document.querySelectorAll('[data-drop]').forEach((el) => {
    el.onclick = () => {
      const e = map.entries.find((x) => x.key === selectedEntry)
      e.members = e.members.filter((m) => m !== el.dataset.drop)
      if (e.members.length === 0) map.entries = map.entries.filter((x) => x.key !== e.key)
      dirty = true
      render()
    }
  })

  const t = $('fTitle'), p = $('fProject'), n = $('fNote'), h = $('fHidden')
  const e = map.entries.find((x) => x.key === selectedEntry)
  if (t) t.oninput = () => { e.title = t.value.trim() || undefined; dirty = true; $('btnSave').disabled = false }
  if (p) p.onchange = () => {
    if (p.value === '__inherit__') delete e.project
    else e.project = p.value || null
    dirty = true; render()
  }
  if (n) n.oninput = () => { e.note = n.value.trim() || undefined; dirty = true; $('btnSave').disabled = false }
  if (h) h.onchange = () => { e.hidden = h.checked || undefined; dirty = true; render() }

  const split = $('btnSplit'), del = $('btnDelete')
  if (split) split.onclick = () => { map.entries = map.entries.filter((x) => x.key !== selectedEntry); selectedEntry = null; dirty = true; render() }
  if (del) del.onclick = split.onclick
}

$('btnMerge').onclick = () => { if (picked.size > 0) createEntry([...picked]) }

// 여러 건을 한 번에 뺄 때. **한 항목으로 묶어서 빼지 않습니다** — 나중에 되돌릴 때
// 한 건씩 되살릴 수 있어야 합니다.
$('btnExclude').onclick = () => {
  for (const id of [...picked]) createEntry([id], { hidden: true })
  picked.clear()
  render()
}

$('btnSave').onclick = async () => {
  showErrors([])
  const r = await fetch('/api/taskmap', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(map),
  })
  const j = await r.json()
  if (!r.ok) return showErrors(j.errors)
  data = j
  map = j.taskmap
  dirty = false
  render()
}

load()
</script>
</body>
</html>
